[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pocketml"
version = "0.1.0"
description = "Local-first tool: point it at a table or text dataset, get a validity report and a model you own."
requires-python = ">=3.10"
dependencies = ["pandas>=2.2", "scikit-learn>=1.6", "openpyxl>=3.1"]

[project.optional-dependencies]
fm = ["tabicl"]
dev = ["pytest"]

[project.scripts]
pocketml = "pocketml.cli:main"

[tool.setuptools]
packages = ["pocketml"]
